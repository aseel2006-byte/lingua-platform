<style>
:root{--bg:#0F0E1A;--sf:#1E1648;--sf2:#261E55;--gold:#C4983A;--gl:#E5B84A;--txt:#F0EDE8;--muted:#8886A0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.nav{position:fixed;top:0;right:0;left:0;z-index:100;background:rgba(15,14,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 24px;display:flex;align-items:center;gap:12px}
.nav .logo{font-size:22px;font-weight:900;color:var(--gold);margin-right:auto}
.nbtn{border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit}
.nbtn.ng{background:linear-gradient(135deg,var(--gold),var(--gl));color:#0F0E1A}
.nbtn.ns{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.1)}
.uinfo{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);padding:6px 14px 6px 10px;border-radius:30px}
.uavatar{width:30px;height:30px;background:linear-gradient(135deg,var(--gold),var(--gl));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#0F0E1A}
.uname{font-size:14px;font-weight:700}.urole{font-size:11px;color:var(--gold)}
.layout{display:flex;padding-top:65px;min-height:100vh}
.sidebar{width:220px;position:fixed;top:65px;bottom:0;right:0;background:rgba(15,14,26,.6);border-left:1px solid rgba(255,255,255,.06);padding:20px 12px;overflow-y:auto}
.sb-section{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;padding:0 8px;margin:16px 0 6px}
.sbitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--muted);transition:.2s;margin-bottom:2px;text-decoration:none;width:100%;border:none;background:none;font-family:inherit;text-align:right}
.sbitem:hover,.sbitem.on{background:rgba(196,152,58,.12);color:var(--gold)}
.sbitem .ic{font-size:18px;width:22px;text-align:center}
.sb-lv{font-size:11px;font-weight:800;background:rgba(196,152,58,.2);color:var(--gold);padding:2px 8px;border-radius:10px;margin-right:auto}
main{margin-right:220px;padding:28px;flex:1}
.card{background:var(--sf);border-radius:16px;padding:24px;margin-bottom:20px}
.hero{background:linear-gradient(135deg,#1E1648,#261E55);border:1px solid rgba(196,152,58,.15)}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 20px;text-align:center;flex:1;min-width:80px}
.stat-n{font-size:24px;font-weight:900;color:var(--gold)}
.stat-l{font-size:12px;color:var(--muted);margin-top:2px}
.xp-bar{background:rgba(255,255,255,.08);border-radius:20px;height:10px;overflow:hidden;margin:12px 0}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gl));border-radius:20px;transition:width .8s}
.sk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sk-card{border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.3s}
.sk-card:hover{transform:translateY(-4px)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.04);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,.05)}
.li:hover{background:rgba(255,255,255,.08)}
.lc{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0}
.lc.done{background:rgba(76,175,80,.2);color:#4CAF50}
.lc.act{background:rgba(196,152,58,.2);color:var(--gold)}
.linfo{flex:1;min-width:0}
.ltitle{font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmeta{font-size:12px;color:var(--muted)}
.start-btn{background:linear-gradient(135deg,#C4983A,#E5B84A);color:#0F0E1A;border:none;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0;transition:.2s}
.start-btn:hover{transform:scale(1.05)}
.lbadge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;flex-shrink:0}
.bd{background:rgba(76,175,80,.2);color:#4CAF50}
.ltabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.lt{padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;background:rgba(255,255,255,.06);color:var(--muted);transition:.2s}
.lt.on{background:rgba(196,152,58,.2);color:var(--gold);border:1px solid rgba(196,152,58,.3)}
.sv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.sv-card{background:var(--sf);border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);transition:.3s;cursor:pointer}
.sv-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gold);color:#0F0E1A;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:9000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:40px;color:var(--muted)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.sh h2{font-size:22px;font-weight:900}
</style>
</head>

var AI_L=[{id:'ai-en-l1',flag:'\uD83C\uDDEC\uD83C\uDDE7',level:'A0',title:'My First Day at School',dur:'3 min',script:'Hello! My name is Alex. Today is my first day at school. My teacher Miss Sarah is very kind. I sit next to Mia who gives me a pencil. At lunch I have a sandwich and apple. We play football. I am happy and have a new friend!',voc:['nervous','excited','teacher','pencil','sandwich'],qs:[{q:'Teacher name?',a:'Miss Sarah'},{q:'What did Alex eat?',a:'Sandwich'},{q:'Feeling?',a:'Happy'}]},{id:'ai-en-l2',flag:'\uD83C\uDDEC\uD83C\uDDE7',level:'A1',title:'A Day at the Market',dur:'4 min',script:'Every Saturday we go to the market. Mr Hassan sells apples for two dollars per kilogram. We buy warm bread and yellow sunflowers. We drink tea with honey at home.',voc:['market','colorful','kilogram','sunflowers','honey'],qs:[{q:'When?',a:'Saturday'},{q:'Apple price?',a:'Two dollars'},{q:'Flowers?',a:'Sunflowers'}]},{id:'ai-en-l3',flag:'\uD83C\uDDEC\uD83C\uDDE7',level:'A2',title:'The Lost Dog',dur:'5 min',script:'One rainy afternoon I found a small dog under a bench. No collar. I gave him sandwich and took him home. Next morning I made a poster. Three days later a girl called BISCUIT!',voc:['collar','wagged','poster','immediately'],qs:[{q:'Where was the dog?',a:'Under a bench'},{q:'Dog name?',a:'Biscuit'},{q:'Days?',a:'Three'}]},{id:'ai-tr-l1',flag:'\uD83C\uDDF9\uD83C\uDDF7',level:'A0',title:'Merhaba! Ben Elif.',dur:'3 min',script:"Merhaba! Ben Elif, on iki yasindayim. Istanbul'da yasiyorum. Kucuk kardesim Ahmet var. Matematik seviyorum.",voc:['Merhaba=Hello','yasiyorum=I live','kardesim=brother'],qs:[{q:'Age?',a:'12'},{q:'Brother?',a:'Ahmet'},{q:'Subject?',a:'Matematik'}]},{id:'ai-zh-l1',flag:'\uD83C\uDDE8\uD83C\uDDF3',level:'A0',title:'\u6211\u7684\u5BB6',dur:'3 min',script:'\u5927\u5BB6\u597D! \u6211\u53EB\u674E\u660E. I am Li Ming. \u6211\u4F4F\u5728\u5317\u4EAC. I live in Beijing. \u6211\u6700\u559C\u6B22\u53A8\u623F. I like the kitchen.',voc:['\u5BB6=home','\u53 var AI_R=[{id:'ai-s1',flag:'\uD83C\uDDEC\uD83C\uDDE7',level:'A0',title:'The Little Cloud',dur:'4 min',moral:'Helping others is braver than hiding.',ar:'\u0633\u062D\u0627\u0628\u0629 \u0635\u063A\u064A\u0631\u0629 \u062A\u062A\u063A\u0644\u0628 \u0639\u0644\u0649 \u062E\u0648\u0641\u0647\u0627.',text:'High above Sunnyville lived Fluff, a small cloud afraid to rain. One hot day flowers turned brown. Fluff tried one raindrop. A flower raised its head. More rain came and children laughed. That night Fluff was brave at last.'},{id:'ai-s2',flag:'\uD83C\uDDEC\uD83C\uDDE7',level:'A1',title:'The Boy Who Collected Colours',dur:'5 min',moral:'Even one colour can change a grey world.',ar:'\u0648\u0644\u062F \u064A\u062C\u0645\u0639 \u0627\u0644\u0623\u0644\u0648\u0627\u0646 \u0633\u0631\u0627\u064B.',text:'In a grey town, Sami collected a red button, blue feather, yellow leaf and green stone. A lost girl showed him her colourful village. Next morning Sami placed his colours on grey doorsteps. Four people felt hope.'},{id:'ai-s3',flag:'\uD83C\uDDEC\uD83C\uDDE7',level:'A2',title:'The Library at the End of the Street',dur:'6 min',moral:'Books have the power to change people.',ar:'\u0645\u0643\u062A\u0628\u0629 \u0645\u0647\u062C\u0648\u0631\u0629 \u062A\u0639\u0648\u062F \u0644\u0644\u062D\u064A\u0627\u0629.',text:'At the end of Maple Street stood a library nobody visited. One rainy day Nora found an old woman inside who said: For you this library never closed. Every person who entered walked out slightly changed.'},{id:'ai-str1',flag:'\uD83C\uDDF9\uD83C\uDDF7',level:'A1',title:'Deniz Feneri',dur:'5 min',moral:'Kucuk bir isik yeterlidir.',ar:'\u0645\u0646\u0627\u0631\u0629 \u0648\u0634\u0645\u0639\u0629.',text:'Keeper Yusuf lit the lighthouse every night. One stormy night the lamp went out. He held a small candle. A ship saw it and arrived safely. Your candle saved us. Even a small light is enough.'},{id:'ai-szh1',flag:'\uD83C\uDDE8\uD83C\uDDF3',level:'A1',title:'\u5C0F\u718A\u76
