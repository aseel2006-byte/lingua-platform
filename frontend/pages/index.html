<!-- ══ SCRIPT ═════════════════════════════════════════════════ -->
<script src="js/api.js"></script>
<script>
  /* ══ State ══════════════════════════════════════════════════ */
  let currentLang='en', currentLevel='B1', currentSkill='all';

  /* ══ Nav — حالة الدخول ══════════════════════════════════════ */
  (function initNav(){
    if(auth.isLoggedIn()){
      const u=auth.getUser(),li=document.getElementById('navLogin'),re=document.getElementById('navRegister');
      if(li){li.textContent=u?.name?.split(' ')[0]||'حسابي';li.onclick=()=>location.href='pages/dashboard.html';}
      if(re){re.textContent=u?.role==='admin'?'Admin':'لوحتي';re.onclick=()=>location.href=(u?.role==='admin'?'pages/admin.html':'pages/dashboard.html');}
    }
  })();

  /* ══ addProd ════════════════════════════════════════════════ */
  function addProd(product){
    cart.add(product);
    showToast('تمت إضافة "'+product.title+'" للسلة ✓');
  }

  /* ══ تحميل المنتجات من API ══════════════════════════════════ */
  async function loadProductsFromAPI(){
    const grid=document.getElementById('productsGrid');if(!grid)return;
    try{
      const params=new URLSearchParams({lang:currentLang,level:currentLevel});
      if(currentSkill!=='all')params.append('skill',currentSkill);
      const data=await apiFetch('/products?'+params);
      const products=data.products||[];
      const ce=document.getElementById('productCount');if(ce)ce.textContent=products.length;
      const le=document.getElementById('filterLabel');if(le)le.textContent='المستوى '+currentLevel+' · '+(currentLang==='en'?'الإنجليزية':currentLang==='tr'?'التركية':'الصينية');
      if(!products.length)return;
      const imap={listening:'ti-ear',speaking:'ti-messages',reading:'ti-book-2',writing:'ti-pencil',pdf:'ti-file-type-pdf',audio:'ti-player-play',bundle:'ti-package'};
      const cmap={en:'#534AB7',tr:'#0B5E46',zh:'#993C1D'};
      const lnm={en:'إنجليزية',tr:'تركية',zh:'صينية'};
      grid.innerHTML=products.map(p=>{
        const badge=p.badge?'<span class="pcard-badge badge-'+p.badge+'">'+(p.badge==='hot'?'الأكثر مبيعاً':p.badge==='new'?'جديد':'مجاني')+'</span>':'';
        const price=p.is_free?'<div class="pcard-price free-price">مجاني</div>':'<div class="pcard-price">'+(p.original_price?'<del>'+Number(p.original_price).toFixed(0)+'</del> ':'')+Number(p.price).toFixed(0)+' ر.س</div>';
        const prod=JSON.stringify({id:p.id,title:p.title,price:p.price,skill:p.skill,lang:p.lang});
        const btn=p.is_free?'<button class="btn btn-jade btn-sm" onclick="event.stopPropagation();showToast(\'جارٍ التحميل...\')"><i class="ti ti-download"></i> حمّل</button>':'<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();addProd('+prod.replace(/"/g,"'")+')" ><i class="ti ti-plus"></i> أضف</button>';
        return '<div class="pcard" onclick="location.href=\'pages/product.html?id='+p.id+'\'">'
          +'<div class="pcard-thumb '+p.lang+'"><i class="ti '+(imap[p.skill]||'ti-book-2')+'" style="color:'+cmap[p.lang]+'"></i>'+badge+'</div>'
          +'<div class="pcard-body"><div class="pcard-title">'+p.title+'</div>'
          +'<div class="pcard-meta">'+p.level+' <span class="meta-dot"></span> '+lnm[p.lang]+' <span class="meta-dot"></span> <span class="pcard-stars"><i class="ti ti-star-filled"></i> '+(p.rating||0)+'</span></div>'
          +'<div class="pcard-foot">'+price+btn+'</div></div></div>';
      }).join('');
    }catch(e){console.warn('API offline — original cards visible');}
  }

  /* ══ Cart ═══════════════════════════════════════════════════ */
  function updateCartUI(){
    const items=cart.get(),count=items.length;
    document.getElementById('cartCount').textContent=count;
    const body=document.getElementById('cartBody'),foot=document.getElementById('cartFoot');
    const imap={listening:'ti-ear',speaking:'ti-messages',reading:'ti-book-2',writing:'ti-pencil',pdf:'ti-file-type-pdf',audio:'ti-player-play',bundle:'ti-package'};
    const lnm={en:'إنجليزية',tr:'تركية',zh:'صينية'};
    if(!count){body.innerHTML='<div class="cart-empty"><i class="ti ti-shopping-cart"></i>سلتك فارغة حالياً</div>';foot.style.display='none';return;}
    let html='',total=0;
    items.forEach(item=>{
      total+=Number(item.price);
      html+='<div class="cart-item"><div class="cart-item-icon"><i class="ti '+(imap[item.skill]||'ti-book-2')+'"></i></div>'
        +'<div class="cart-item-info"><div class="cart-item-title">'+item.title+'</div><div class="cart-item-meta">'+(lnm[item.lang]||'')+'</div></div>'
        +'<div class="cart-item-price">'+Number(item.price).toFixed(0)+' ر.س</div>'
        +'<button class="cart-item-remove" onclick="cart.remove(\''+item.id+'\')"><i class="ti ti-trash"></i></button></div>';
    });
    body.innerHTML=html;
    document.getElementById('cartTotal').textContent=total.toFixed(0)+' ر.س';
    foot.style.display='block';
  }

  function closeCart(){document.getElementById('cartOverlay').classList.remove('open');}

  document.getElementById('cartBtn').addEventListener('click',()=>{
    document.getElementById('cartOverlay').classList.toggle('open');updateCartUI();
  });
  document.getElementById('cartOverlay').addEventListener('click',function(e){if(e.target===this)closeCart();});
  window.addEventListener('cartUpdated',updateCartUI);

  /* ══ Toast ══════════════════════════════════════════════════ */
  let _tt;
  function showToast(msg){
    const t=document.getElementById('toast'),m=document.getElementById('toastMsg');
    if(t&&m){m.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2800);}
  }

  /* ══ FAQ ════════════════════════════════════════════════════ */
  function toggleFaq(el){
    const item=el.closest('.faq-item'),isOpen=item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(i=>i.classList.remove('open'));
    if(!isOpen)item.classList.add('open');
  }

  /* ══ Filters — مربوطة بـ API ════════════════════════════════ */
  function filterLang(lang){
    currentLang=lang;
    document.querySelectorAll('.lang-filter-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.lang-option').forEach(b=>b.classList.remove('active'));
    if(event?.currentTarget)event.currentTarget.classList.add('active');
    showToast('تم تصفية: '+(lang==='en'?'الإنجليزية':lang==='tr'?'التركية':'الصينية'));
    loadProductsFromAPI();
  }

  function filterLevel(lvl){
    currentLevel=lvl;
    document.querySelectorAll('.lvl-btn').forEach(b=>{if(!b.classList.contains('done'))b.classList.remove('active');});
    if(event?.currentTarget)event.currentTarget.classList.add('active');
    showToast('المستوى: '+lvl);
    loadProductsFromAPI();
  }

  function filterSkill(skill){
    currentSkill=skill;
    document.querySelectorAll('.skill-btn').forEach(b=>b.classList.remove('active'));
    if(event?.currentTarget)event.currentTarget.classList.add('active');
    loadProductsFromAPI();
  }

  /* ══ تهيئة ═════════════════════════════════════════════════ */
  updateCartUI();
  window.addEventListener('load',loadProductsFromAPI);
</script>
</body>
</html>
