<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>دخول — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--plum:#1E1648;--plum-m:#3D2F8A;--plum-l:#EEEDFE;--gold:#C4983A;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--white:#fff;--ink:#0F0E1A;--ink-2:#3A3852;--ink-3:#8886A0;--border:#E5E2F0;--r-md:10px;--r-lg:16px;--r-xl:22px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--plum);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;}
[data-lang="en"]{direction:ltr}
[data-lang="en"] body{font-family:'IBM Plex Sans',sans-serif}
.deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.deco-1{width:500px;height:500px;top:-200px;left:-150px}
.deco-2{width:300px;height:300px;bottom:-100px;right:-80px}
.ar{display:block}.en{display:none}
[data-lang="en"] .ar{display:none}[data-lang="en"] .en{display:block}
span.ar,span.en{display:inline}
[data-lang="en"] span.ar{display:none}[data-lang="ar"] span.en{display:none}
/* Header */
.auth-header{text-align:center;margin-bottom:2rem;position:relative;z-index:1}
.logo-mark{width:56px;height:56px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;backdrop-filter:blur(10px)}
.logo-mark i{font-size:28px;color:var(--gold)}
.auth-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:4px}
.auth-sub{font-size:13px;color:rgba(255,255,255,.6)}
/* Card */
.auth-card{background:var(--white);border-radius:var(--r-xl);padding:2rem;width:100%;max-width:440px;box-shadow:0 24px 80px rgba(0,0,0,.3);position:relative;z-index:1}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.75rem}
.tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{color:var(--plum)}
.tab.active{color:var(--plum);border-bottom-color:var(--plum)}
/* Form */
.form-group{margin-bottom:1.1rem}
label{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:5px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink-3)}
[data-lang="ar"] .input-wrap i{left:12px}[data-lang="en"] .input-wrap i{right:12px}
.input-wrap input{width:100%;padding:11px 40px 11px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:14px;font-family:inherit;outline:none;color:var(--ink);transition:.15s}
[data-lang="ar"] .input-wrap input{padding:11px 14px 11px 40px}
.input-wrap input:focus{border-color:#AFA9EC;box-shadow:0 0 0 3px rgba(83,74,183,.1)}
.forgot{font-size:12px;color:var(--plum);cursor:pointer;text-decoration:none}
/* Buttons */
.btn-submit{width:100%;padding:13px;background:var(--plum);color:var(--white);border:none;border-radius:var(--r-md);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:1.25rem}
.btn-submit:hover{background:var(--plum-m)}
.divider{display:flex;align-items:center;gap:12px;margin:1.25rem 0;color:var(--ink-3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-google{width:100%;padding:11px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
.btn-google:hover{background:var(--sand)}
.google-icon{width:18px;height:18px;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%234285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="%2334A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="%23FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="%23EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>') center/contain no-repeat;flex-shrink:0}
/* Trust badges */
.trust-badges{display:flex;justify-content:center;gap:1.5rem;margin-top:1.25rem;flex-wrap:wrap}
.tbadge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.tbadge i{font-size:13px;color:var(--jade)}
/* Error/Success */
.msg{padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:1rem;display:none}
.msg.error{background:#FEE2E2;color:#DC2626;border:1px solid #FCA5A5}
.msg.success{background:var(--jade-l);color:var(--jade);border:1px solid #9FE1CB}
.msg.show{display:block}
/* Demo box */
.demo-box{background:linear-gradient(135deg,#1E1648,#3D2F8A);border-radius:var(--r-lg);padding:1rem 1.25rem;margin-top:1.25rem}
.demo-title{font-size:11px;color:#E8C96A;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.demo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-btn{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;transition:.15s;text-align:center}
.demo-btn:hover{background:rgba(255,255,255,.18)}
/* Lang toggle */
.lang-toggle{position:absolute;top:1rem;left:1rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;z-index:2}
[data-lang="en"] .lang-toggle{left:auto;right:1rem}
</style>
</head>
<body>
<button class="lang-toggle" id="langBtn" onclick="toggleLang()">EN</button>
<div class="deco deco-1"></div>
<div class="deco deco-2"></div>

<div class="auth-header">
  <div class="logo-mark"><i class="ti ti-language"></i></div>
  <div class="auth-title">Lingua</div>
  <div class="auth-sub ar">معهد اللغات الأكاديمي</div>
  <div class="auth-sub en">Academic Language Institute</div>
</div>

<div class="auth-card">
  <div class="msg" id="msg"></div>
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">
      <i class="ti ti-login"></i>
      <span class="ar">دخول</span><span class="en">Login</span>
    </div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">
      <i class="ti ti-user-plus"></i>
      <span class="ar">حساب جديد</span><span class="en">Register</span>
    </div>
  </div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <div class="form-group">
      <label><span class="ar">البريد الإلكتروني</span><span class="en">Email</span></label>
      <div class="input-wrap">
        <i class="ti ti-mail"></i>
        <input type="email" id="login-email" placeholder="you@example.com"/>
      </div>
    </div>
    <div class="form-group">
      <label style="display:flex;justify-content:space-between">
        <span><span class="ar">كلمة المرور</span><span class="en">Password</span></span>
        <a class="forgot"><span class="ar">نسيت كلمة المرور؟</span><span class="en">Forgot password?</span></a>
      </label>
      <div class="input-wrap">
        <i class="ti ti-lock"></i>
        <input type="password" id="login-pass" placeholder="••••••••"/>
      </div>
    </div>
    <button class="btn-submit" onclick="doLogin()">
      <i class="ti ti-login"></i>
      <span class="ar">دخول</span><span class="en">Login</span>
    </button>
    <div class="divider"><span class="ar">أو</span><span class="en">or</span></div>
    <button class="btn-google" onclick="googleLogin()">
      <div class="google-icon"></div>
      <span class="ar">المتابعة بحساب Google</span><span class="en">Continue with Google</span>
    </button>
    <div class="trust-badges">
      <div class="tbadge"><i class="ti ti-shield-check"></i><span class="ar">ضمان 7 أيام</span><span class="en">7-Day Guarantee</span></div>
      <div class="tbadge"><i class="ti ti-lock"></i><span class="ar">دخول آمن</span><span class="en">Secure Login</span></div>
    </div>
  </div>

  <!-- REGISTER FORM -->
  <div id="form-register" style="display:none">
    <div class="form-group">
      <label><span class="ar">الاسم الكامل</span><span class="en">Full Name</span></label>
      <div class="input-wrap">
        <i class="ti ti-user"></i>
        <input type="text" id="reg-name" placeholder="Mohammed Al-Otaibi"/>
      </div>
    </div>
    <div class="form-group">
      <label><span class="ar">البريد الإلكتروني</span><span class="en">Email</span></label>
      <div class="input-wrap">
        <i class="ti ti-mail"></i>
        <input type="email" id="reg-email" placeholder="you@example.com"/>
      </div>
    </div>
    <div class="form-group">
      <label><span class="ar">كلمة المرور</span><span class="en">Password</span></label>
      <div class="input-wrap">
        <i class="ti ti-lock"></i>
        <input type="password" id="reg-pass" placeholder="••••••••"/>
      </div>
    </div>
    <button class="btn-submit" onclick="doRegister()">
      <i class="ti ti-user-plus"></i>
      <span class="ar">إنشاء حساب</span><span class="en">Create Account</span>
    </button>
    <div class="divider"><span class="ar">أو</span><span class="en">or</span></div>
    <button class="btn-google" onclick="googleLogin()">
      <div class="google-icon"></div>
      <span class="ar">التسجيل بحساب Google</span><span class="en">Register with Google</span>
    </button>
  </div>

  <!-- DEMO BOX -->
  <div class="demo-box">
    <div class="demo-title">
      <i class="ti ti-bolt" style="font-size:13px"></i>
      <span class="ar">دخول تجريبي سريع</span><span class="en">Quick Demo Login</span>
    </div>
    <div class="demo-btns">
      <button class="demo-btn" onclick="demoLogin('student')">
        <span class="ar">👤 طالب</span><span class="en">👤 Student</span>
      </button>
      <button class="demo-btn" onclick="demoLogin('admin')">
        <span class="ar">👑 Admin</span><span class="en">👑 Admin</span>
      </button>
    </div>
  </div>
</div>

<script>
function L(){return document.documentElement.getAttribute('data-lang')||'ar';}

function toggleLang(){
  var h=document.documentElement,cur=h.getAttribute('data-lang'),next=cur==='ar'?'en':'ar';
  h.setAttribute('data-lang',next);h.setAttribute('lang',next);h.setAttribute('dir',next==='ar'?'rtl':'ltr');
  document.getElementById('langBtn').textContent=next==='ar'?'EN':'عربي';
  document.title=(next==='ar'?'دخول':'Login')+' — Lingua';
}

function showMsg(text,type){
  var m=document.getElementById('msg');
  m.textContent=text;m.className='msg '+type+' show';
  setTimeout(function(){m.classList.remove('show');},4000);
}

function switchTab(tab){
  var isLogin=tab==='login';
  document.getElementById('tab-login').classList.toggle('active',isLogin);
  document.getElementById('tab-register').classList.toggle('active',!isLogin);
  document.getElementById('form-login').style.display=isLogin?'block':'none';
  document.getElementById('form-register').style.display=isLogin?'none':'block';
}

function doLogin(){
  var email=document.getElementById('login-email').value.trim();
  var pass=document.getElementById('login-pass').value;
  var lang=L();
  if(!email||!email.includes('@')){showMsg(lang==='ar'?'أدخل بريداً إلكترونياً صحيحاً':'Enter a valid email','error');return;}
  if(!pass||pass.length<4){showMsg(lang==='ar'?'أدخل كلمة مرور صحيحة':'Enter a valid password','error');return;}
  // Demo login logic
  var role = email.includes('admin')?'admin':'student';
  var name = role==='admin'?'الأستاذ كريم':'محمد العتيبي';
  localStorage.setItem('lingua_token','token-'+Date.now());
  localStorage.setItem('lingua_user',JSON.stringify({id:'u1',name:name,email:email,role:role}));
  showMsg(lang==='ar'?'تم الدخول بنجاح! جارٍ التحويل...':'Login successful! Redirecting...','success');
  setTimeout(function(){location.href=role==='admin'?'admin.html':'dashboard.html';},1200);
}

function doRegister(){
  var name=document.getElementById('reg-name').value.trim();
  var email=document.getElementById('reg-email').value.trim();
  var pass=document.getElementById('reg-pass').value;
  var lang=L();
  if(!name){showMsg(lang==='ar'?'أدخل اسمك الكامل':'Enter your full name','error');return;}
  if(!email||!email.includes('@')){showMsg(lang==='ar'?'أدخل بريداً إلكترونياً صحيحاً':'Enter a valid email','error');return;}
  if(!pass||pass.length<6){showMsg(lang==='ar'?'كلمة المرور يجب أن تكون 6 أحرف على الأقل':'Password must be at least 6 characters','error');return;}
  localStorage.setItem('lingua_token','token-'+Date.now());
  localStorage.setItem('lingua_user',JSON.stringify({id:'u'+Date.now(),name:name,email:email,role:'student'}));
  showMsg(lang==='ar'?'تم إنشاء الحساب! جارٍ التحويل...':'Account created! Redirecting...','success');
  setTimeout(function(){location.href='dashboard.html';},1200);
}

function googleLogin(){
  var lang=L();
  showMsg(lang==='ar'?'Google Login غير متاح في الوضع التجريبي — استخدم الدخول التجريبي أدناه':'Google Login unavailable in demo — use Quick Demo Login below','error');
}

function demoLogin(role){
  var users={
    student:{id:'demo-s',name:'محمد العتيبي',email:'student@lingua.sa',role:'student'},
    admin:{id:'demo-a',name:'الأستاذ كريم',email:'admin@lingua.sa',role:'admin'}
  };
  var user=users[role];
  localStorage.setItem('lingua_token','demo-'+role+'-'+Date.now());
  localStorage.setItem('lingua_user',JSON.stringify(user));
  location.href=role==='admin'?'admin.html':'dashboard.html';
}

// تحقق من redirect param
var tab=new URLSearchParams(location.search).get('tab');
if(tab==='register') switchTab('register');

// تحقق إن كان مسجّل دخول
if(localStorage.getItem('lingua_token')){
  var u=JSON.parse(localStorage.getItem('lingua_user')||'null');
  if(u) location.href=u.role==='admin'?'admin.html':'dashboard.html';
}
</script>
</body>
</html>
