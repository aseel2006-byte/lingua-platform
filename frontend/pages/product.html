<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>تفاصيل المنتج — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--plum:#1E1648;--plum-m:#3D2F8A;--plum-l:#EEEDFE;--gold:#C4983A;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--white:#fff;--ink:#0F0E1A;--ink-2:#3A3852;--ink-3:#8886A0;--border:#E5E2F0;--r-md:10px;--r-lg:16px;--r-xl:22px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;}
.nav{background:#fff;border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:10;gap:12px;}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--plum);text-decoration:none;display:flex;align-items:center;gap:8px;}
.logo-mark{width:32px;height:32px;background:var(--plum);border-radius:8px;display:flex;align-items:center;justify-content:center;}.logo-mark i{color:#fff;font-size:16px;}
.back-btn{margin-right:auto;background:none;border:1px solid var(--border);border-radius:var(--r-md);padding:7px 14px;font-size:13px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;}.back-btn:hover{background:var(--plum-l);}
main{max-width:980px;margin:0 auto;padding:2rem 1.5rem;display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start;}
@media(max-width:700px){main{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);padding:1.5rem;margin-bottom:1rem;}
.pthumb{height:160px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;font-size:56px;position:relative;}
.pthumb.en{background:var(--plum-l)}.pthumb.tr{background:var(--jade-l)}.pthumb.zh{background:#FAECE7}
.ptitle{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--plum);margin-bottom:.75rem;}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
.tag{display:inline-flex;align-items:center;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;}
.tag-p{background:var(--plum-l);color:var(--plum-m);}.tag-g{background:#FBF4E3;color:var(--gold);border:1px solid var(--gold);}
.pdesc{font-size:14px;color:var(--ink-2);line-height:1.8;margin-bottom:1.5rem;}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.feat{background:var(--sand);border-radius:10px;padding:12px;text-align:center;}
.feat i{font-size:22px;color:var(--plum-m);display:block;margin-bottom:6px;}.fv{font-size:13px;font-weight:600;color:var(--plum);}.fl{font-size:11px;color:var(--ink-3);}
.rt{font-size:15px;font-weight:700;color:var(--plum);margin-bottom:1rem;}
.ri{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}.ri:last-child{border-bottom:none;}
.av{width:36px;height:36px;border-radius:50%;background:var(--plum-l);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--plum-m);flex-shrink:0;}
.rn{font-size:12px;font-weight:600;color:var(--plum);}.rs{color:var(--gold);font-size:12px;margin:2px 0;}.rt2{font-size:13px;color:var(--ink-2);line-height:1.6;}
.pb{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--plum);margin-bottom:4px;}
.pb del{font-size:16px;color:var(--ink-3);font-family:inherit;font-weight:400;margin-left:8px;}
.sv{font-size:12px;color:var(--jade);background:var(--jade-l);padding:3px 9px;border-radius:5px;font-weight:600;display:inline-block;margin-bottom:1rem;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;border-radius:var(--r-md);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:8px;}.btn:hover{opacity:.88;}
.btn-gold{background:var(--gold);color:var(--plum);}.btn-plum{background:var(--plum);color:#fff;}.btn-out{background:transparent;border:1px solid var(--border);color:var(--ink-2);}
.gs{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.g{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);}.g i{color:var(--jade);font-size:14px;}
.sticky{position:sticky;top:70px;}
.pb2{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;}
.bh{background:var(--plum);color:#fff;}.bn{background:var(--gold);color:var(--plum);}.bf{background:var(--jade-l);color:var(--jade);}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--plum);color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;font-weight:500;z-index:999;transition:transform .3s;display:flex;align-items:center;gap:8px;}
.toast.show{transform:translateX(-50%) translateY(0);}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav class="nav">
  <a class="logo" href="index.html"><div class="logo-mark"><i class="ti ti-language"></i></div>Lingua</a>
  <button class="back-btn" onclick="history.back()"><i class="ti ti-arrow-right"></i> رجوع</button>
</nav>
<main>
  <div id="pc"><div style="text-align:center;padding:3rem;color:#8886A0"><i class="ti ti-loader" style="font-size:36px;display:block;margin:0 auto 1rem;animation:spin .8s linear infinite;color:#3D2F8A"></i>جارٍ التحميل...</div></div>
  <div id="ps"></div>
</main>
<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toastMsg"></span></div>
<script>
var imap={listening:'ti-ear',speaking:'ti-messages',reading:'ti-book-2',writing:'ti-pencil',pdf:'ti-file-type-pdf',audio:'ti-player-play',bundle:'ti-package'};
var cmap={en:'#534AB7',tr:'#0B5E46',zh:'#993C1D'};
var lname={en:'إنجليزية',tr:'تركية',zh:'صينية'};
var _tt;
function showToast(msg){var t=document.getElementById('toast'),m=document.getElementById('toastMsg');m.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},2800);}
var cart={
  get:function(){return JSON.parse(localStorage.getItem('lingua_cart')||'[]');},
  save:function(c){localStorage.setItem('lingua_cart',JSON.stringify(c));},
  add:function(p){var c=cart.get();if(!c.find(function(i){return i.id===p.id;}))c.push(p);cart.save(c);showToast('تمت الإضافة للسلة');}
};
var products={
  'listen-b1':{id:'listen-b1',title:'الاستماع B1 — مواقف حياتية يومية',price:89,orig:null,skill:'listening',lang:'en',level:'B1',rating:4.9,cnt:142,desc:'درس أكاديمي متكامل في مهارة الاستماع للمستوى B1 — يشمل 20 موقفاً حياتياً مع تسجيلات بصوت الأستاذ كريم وتمارين تفاعلية.',badge:'hot',free:false,reviews:[{n:'محمد العتيبي',r:5,t:'ممتاز جداً، التسجيلات واضحة ومفيدة جداً.'},{n:'سارة الحربي',r:5,t:'أفضل درس استماع جربته.'},{n:'خالد الدوسري',r:5,t:'تحسّن استماعي بشكل ملحوظ.'}]},
  'speak-b1':{id:'speak-b1',title:'المحادثة B1 — المطار والسفر',price:75,orig:99,skill:'speaking',lang:'en',level:'B1',rating:4.8,cnt:98,desc:'درس محادثة عملي يغطي مواقف المطار والفندق والسفر — حوارات حقيقية بصوت الأستاذ كريم.',badge:'new',free:false,reviews:[{n:'نورة المطيري',r:5,t:'تحسّن نطقي كثيراً.'},{n:'فهد القحطاني',r:4,t:'محتوى ممتاز.'}]},
  'read-b1':{id:'read-b1',title:'القراءة B1 — كتاب تفاعلي مع تمارين',price:79,orig:null,skill:'reading',lang:'en',level:'B1',rating:4.9,cnt:76,desc:'كتاب PDF تفاعلي يحتوي على 15 نصاً بمستوى B1 مع تمارين فهم وإجابات مفصّلة.',badge:null,free:false,reviews:[{n:'ريم العبدالله',r:5,t:'الكتاب منظّم بشكل أكاديمي ممتاز.'}]},
  'write-b1':{id:'write-b1',title:'الكتابة B1 — رسائل ونصوص يومية',price:79,orig:null,skill:'writing',lang:'en',level:'B1',rating:4.7,cnt:54,desc:'دليل الكتابة الأكاديمية للمستوى B1 — رسائل رسمية وغير رسمية مع نماذج وتصحيحات.',badge:null,free:false,reviews:[]},
  'audio-b1':{id:'audio-b1',title:'قصص صوتية B1 — ثلاث قصص قصيرة',price:0,orig:null,skill:'audio',lang:'en',level:'B1',rating:5.0,cnt:201,desc:'ثلاث قصص صوتية مجانية بمستوى B1 — مقروءة ببطء واضح مع نص مكتوب مرفق.',badge:'free',free:true,reviews:[{n:'أحمد السالم',r:5,t:'هدية رائعة! الصوت واضح والقصص ممتعة.'}]},
  'bundle-b1':{id:'bundle-b1',title:'باقة B1 الكاملة — كل المهارات',price:249,orig:350,skill:'bundle',lang:'en',level:'B1',rating:5.0,cnt:189,desc:'الباقة الشاملة لمستوى B1 تضم جميع المهارات: استماع + محادثة + قراءة + كتابة + قصص صوتية + كتب PDF.',badge:null,free:false,reviews:[{n:'مريم الزهراني',r:5,t:'أفضل استثمار! كل المهارات في مكان واحد.'}]},
  'full-en':{id:'full-en',title:'الإنجليزية الكاملة A0-C2',price:399,orig:799,skill:'bundle',lang:'en',level:'A0-C2',rating:4.9,cnt:342,desc:'المنهج الأكاديمي المتكامل للأستاذ كريم — جميع المستويات والمهارات في حصة واحدة مع كتب تفاعلية وتسجيلات حية.',badge:'hot',free:false,reviews:[{n:'محمد العتيبي',r:5,t:'أفضل منهج تعليمي رأيته في حياتي.'},{n:'سارة الحربي',r:5,t:'استثمار يستحق كل ريال.'}]}
};

var id=new URLSearchParams(location.search).get('id');
if(!id){location.href='index.html';}

var p=products[id]||{id:id,title:'منتج '+id,price:99,skill:'bundle',lang:'en',level:'B1',rating:4.5,cnt:0,desc:'',badge:null,free:false,reviews:[]};
document.title=p.title+' — Lingua';

var badge='';
if(p.badge==='hot')badge='<span class="pb2 bh">الأكثر مبيعاً</span>';
else if(p.badge==='new')badge='<span class="pb2 bn">جديد</span>';
else if(p.badge==='free')badge='<span class="pb2 bf">مجاني</span>';

var reviewsHTML='';
if(p.reviews&&p.reviews.length){
  for(var i=0;i<p.reviews.length;i++){
    var rv=p.reviews[i];
    var stars='';
    for(var s=0;s<rv.r;s++)stars+='★';
    for(var s2=rv.r;s2<5;s2++)stars+='☆';
    reviewsHTML+='<div class="ri"><div class="av">'+rv.n.slice(0,2)+'</div><div><div class="rn">'+rv.n+'</div><div class="rs">'+stars+'</div><div class="rt2">'+rv.t+'</div></div></div>';
  }
}else{
  reviewsHTML='<div style="color:#8886A0;font-size:13px;padding:1rem 0;text-align:center">لا توجد تقييمات بعد</div>';
}

document.getElementById('pc').innerHTML=
  '<div class="card">'
  +'<div class="pthumb '+p.lang+'"><i class="ti '+(imap[p.skill]||'ti-book-2')+'" style="font-size:56px;color:'+(cmap[p.lang]||'#534AB7')+'"></i>'+badge+'</div>'
  +'<h1 class="ptitle">'+p.title+'</h1>'
  +'<div class="meta"><span class="tag tag-p">'+p.level+'</span><span class="tag tag-p">'+(lname[p.lang]||'')+'</span><span class="tag tag-g"><i class="ti ti-star"></i> '+p.rating+' ('+p.cnt+' تقييم)</span>'
  +(p.free?'<span class="tag" style="background:var(--jade-l);color:var(--jade)">مجاني</span>':'')
  +'</div>'
  +'<p class="pdesc">'+p.desc+'</p>'
  +'<div class="feats"><div class="feat"><i class="ti ti-infinity"></i><div class="fv">مدى الحياة</div><div class="fl">وصول دائم</div></div><div class="feat"><i class="ti ti-device-mobile"></i><div class="fv">جميع الأجهزة</div><div class="fl">متوافق</div></div><div class="feat"><i class="ti ti-certificate"></i><div class="fv">شهادة</div><div class="fl">عند الإتمام</div></div></div>'
  +'</div>'
  +'<div class="card"><div class="rt"><i class="ti ti-star-filled" style="color:var(--gold)"></i> تقييمات الطلاب ('+p.reviews.length+')</div>'
  +reviewsHTML+'</div>';

var priceH='';
if(p.free){
  priceH='<div class="pb" style="color:var(--jade)">مجاني</div>';
}else{
  priceH='<div class="pb">'+(p.orig?'<del>'+p.orig+' ر.س</del>':'')+' '+p.price+' ر.س</div>';
  if(p.orig)priceH+='<span class="sv">وفّر '+Math.round((1-p.price/p.orig)*100)+'%</span>';
}

document.getElementById('ps').innerHTML=
  '<div class="card sticky">'+priceH
  +(p.free
    ? '<button class="btn btn-jade" onclick="showToast('جارٍ التحميل...')"><i class="ti ti-download"></i> حمّل مجاناً</button>'
    : '<button class="btn btn-gold" id="buyBtn"><i class="ti ti-credit-card"></i> اشترِ الآن</button><button class="btn btn-out" id="cartBtn"><i class="ti ti-shopping-cart"></i> أضف للسلة</button>')
  +'<div class="gs"><div class="g"><i class="ti ti-shield-check"></i> ضمان استرداد 7 أيام</div><div class="g"><i class="ti ti-infinity"></i> وصول مدى الحياة</div><div class="g"><i class="ti ti-mail"></i> رابط الدرس فوراً</div><div class="g"><i class="ti ti-device-mobile"></i> يعمل على جميع الأجهزة</div></div></div>';

var buyBtn=document.getElementById('buyBtn');
var cartBtn=document.getElementById('cartBtn');
if(buyBtn)buyBtn.onclick=function(){cart.add({id:p.id,title:p.title,price:p.price,skill:p.skill,lang:p.lang});location.href='checkout.html';};
if(cartBtn)cartBtn.onclick=function(){cart.add({id:p.id,title:p.title,price:p.price,skill:p.skill,lang:p.lang});};
</script>
</body></html>
