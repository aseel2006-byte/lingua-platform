<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>تفاصيل المنتج — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--plum:#1E1648;--plum-m:#3D2F8A;--plum-l:#EEEDFE;--gold:#C4983A;--gold-l:#FBF4E3;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--white:#fff;--ink:#0F0E1A;--ink-2:#3A3852;--ink-3:#8886A0;--border:#E5E2F0;--r-md:10px;--r-lg:16px;--r-xl:22px;}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh}
.nav{background:#fff;border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:10;gap:12px}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--plum);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo-mark{width:32px;height:32px;background:var(--plum);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark i{color:#fff;font-size:16px}
.back-btn{margin-right:auto;background:none;border:1px solid var(--border);border-radius:var(--r-md);padding:7px 14px;font-size:13px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.back-btn:hover{background:var(--plum-l)}
main{max-width:1000px;margin:0 auto;padding:2rem 1.5rem;display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start}
@media(max-width:700px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);padding:1.5rem;margin-bottom:1rem}
.pthumb{height:160px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;font-size:56px;position:relative}
.pthumb.en{background:var(--plum-l)}.pthumb.tr{background:var(--jade-l)}.pthumb.zh{background:#FAECE7}
.badge-lbl{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:5px;font-size:11px;font-weight:700;position:absolute;top:12px;right:12px}
.b-hot{background:var(--plum);color:#fff}.b-new{background:var(--gold);color:var(--plum)}.b-free{background:var(--jade-l);color:var(--jade);border:1px solid #9FE1CB}
.ptitle{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--plum);margin-bottom:.75rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600}
.cp{background:var(--plum-l);color:var(--plum-m)}.cg{background:var(--gold-l);color:var(--gold)}.cj{background:var(--jade-l);color:var(--jade)}
.pdesc{font-size:14px;color:var(--ink-2);line-height:1.8;margin-bottom:1.5rem}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.feat{background:var(--sand);border-radius:10px;padding:12px;text-align:center}
.feat i{font-size:22px;color:var(--plum-m);display:block;margin-bottom:6px}.feat-val{font-size:13px;font-weight:600;color:var(--plum)}.feat-lbl{font-size:11px;color:var(--ink-3)}
.rev-title{font-size:15px;font-weight:700;color:var(--plum);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.rev{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.rev:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--plum-l);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--plum-m);flex-shrink:0}
.rn{font-size:12px;font-weight:600;color:var(--plum)}.rs{color:var(--gold);font-size:12px;margin:2px 0}.rt{font-size:13px;color:var(--ink-2);line-height:1.6}
.pbox{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--plum);margin-bottom:4px}
.pbox del{font-size:16px;color:var(--ink-3);font-family:inherit;font-weight:400;margin-left:8px}
.stag{font-size:12px;color:var(--jade);background:var(--jade-l);padding:3px 9px;border-radius:5px;font-weight:600;display:inline-block;margin-bottom:1rem}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;border-radius:var(--r-md);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:8px}
.btn:hover{opacity:.88}.bg{background:var(--gold);color:var(--plum)}.bp{background:var(--plum);color:#fff}.bj{background:var(--jade);color:#fff}.bh{background:transparent;border:1px solid var(--border);color:var(--ink-2)}
.gs{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.g{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)}.g i{color:var(--jade);font-size:14px}
.ss{position:sticky;top:70px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body>
<nav class="nav">
  <a class="logo" href="index.html"><div class="logo-mark"><i class="ti ti-language"></i></div>Lingua</a>
  <button class="back-btn" onclick="history.back()"><i class="ti ti-arrow-right"></i> رجوع</button>
</nav>
<main><div id="pc"></div><div id="sc2"></div></main>
<script>
const PRODUCTS={
  'listen-b1':{id:'listen-b1',title:'الاستماع B1 — مواقف حياتية يومية',price:89,skill:'listening',lang:'en',level:'B1',rating:4.9,reviews:142,badge:'hot',desc:'درس أكاديمي متكامل في مهارة الاستماع للمستوى B1 — يشمل 20 موقفاً حياتياً يومياً مع تسجيلات بصوت الأستاذ كريم وتمارين تفاعلية.',rlist:[{n:'محمد العتيبي',r:5,c:'أفضل درس استماع جربته. الأستاذ كريم يشرح ببساطة رائعة.'},{n:'سارة الحربي',r:5,c:'المواقف الحياتية مفيدة جداً وتطبيقها سهل.'},{n:'خالد الدوسري',r:5,c:'تطورت كثيراً في الاستماع خلال أسبوعين فقط.'}]},
  'speak-b1':{id:'speak-b1',title:'المحادثة B1 — المطار والسفر',price:75,op:99,skill:'speaking',lang:'en',level:'B1',rating:4.8,reviews:98,badge:'new',desc:'درس المحادثة للمستوى B1 يركز على مواقف المطار والسفر — تعلم كيف تتحدث بثقة في أي مطار حول العالم.',rlist:[{n:'نورة المطيري',r:5,c:'الآن أستطيع التحدث بثقة في المطار!'},{n:'فهد العمري',r:4,c:'مفيد جداً، أتمنى لو فيه مزيد من المواقف.'}]},
  'read-b1':{id:'read-b1',title:'القراءة B1 — كتاب تفاعلي مع تمارين',price:79,skill:'reading',lang:'en',level:'B1',rating:4.9,reviews:115,desc:'كتاب PDF تفاعلي متكامل للقراءة بالمستوى B1 — 15 نص أصيل مع أسئلة فهم وشرح مفردات.',rlist:[{n:'أحمد الشمري',r:5,c:'الكتاب التفاعلي رائع، التمارين تثبت المعلومة.'},{n:'منى القحطاني',r:5,c:'ممتاز، أنهيته في أسبوع واحد.'}]},
  'write-b1':{id:'write-b1',title:'الكتابة B1 — رسائل ونصوص يومية',price:79,skill:'writing',lang:'en',level:'B1',rating:4.7,reviews:87,desc:'تعلم كتابة رسائل البريد الإلكتروني والنصوص اليومية بالإنجليزية.',rlist:[{n:'لطيفة السبيعي',r:5,c:'الآن أكتب إيميلات احترافية بثقة!'},{n:'يوسف البلوي',r:4,c:'مفيد جداً لمن يحتاج الكتابة في العمل.'}]},
  'audio-b1':{id:'audio-b1',title:'قصص صوتية B1 — ثلاث قصص',price:0,free:1,skill:'audio',lang:'en',level:'B1',rating:5.0,reviews:203,badge:'free',desc:'ثلاث قصص صوتية مجانية بالمستوى B1 — مدة كل قصة 15 دقيقة مع النص الكامل.',rlist:[{n:'ريم الدوسري',r:5,c:'مجاني ورائع! شكراً الأستاذ كريم.'},{n:'عبدالله العسيري',r:5,c:'القصص ممتعة وأسلوب السرد رائع.'}]},
  'bundle-b1':{id:'bundle-b1',title:'باقة B1 الكاملة — كل المهارات',price:249,op:350,skill:'bundle',lang:'en',level:'B1',rating:5.0,reviews:267,desc:'الباقة الشاملة للمستوى B1 — جميع المهارات: استماع + محادثة + قراءة + كتابة + قصص صوتية.',rlist:[{n:'حمد الغامدي',r:5,c:'أفضل استثمار! وفّرت 100 ريال مع باقة B1.'},{n:'نوف الحارثي',r:5,c:'كاملة ورائعة. أنهيت B1 في شهر واحد.'}]},
  'full-en':{id:'full-en',title:'الإنجليزية الكاملة A0-C2',price:399,op:799,skill:'bundle',lang:'en',level:'A0-C2',rating:4.9,reviews:412,badge:'hot',desc:'المنهج الأكاديمي المتكامل للأستاذ كريم — من مبتدئ مطلق إلى مستوى C2.',rlist:[{n:'سلطان المالكي',r:5,c:'أفضل قرار في حياتي! من صفر إلى C1 خلال سنة.'},{n:'هدى الزهراني',r:5,c:'المنهج منظم ومتسلسل بشكل احترافي جداً.'}]}
};
const IM={listening:'ti-ear',speaking:'ti-messages',reading:'ti-book-2',writing:'ti-pencil',pdf:'ti-file-type-pdf',audio:'ti-player-play',bundle:'ti-package'};
const CM={en:'#534AB7',tr:'#0B5E46',zh:'#993C1D'};
const LN={en:'إنجليزية',tr:'تركية',zh:'صينية'};
const id=new URLSearchParams(location.search).get('id')||'listen-b1';
const p=PRODUCTS[id]||PRODUCTS['listen-b1'];
const rl=p.rlist||[];
document.title=p.title+' — Lingua';
const bd=p.badge?'<span class="badge-lbl '+(p.badge==='hot'?'b-hot':p.badge==='new'?'b-new':'b-free')+'">'+(p.badge==='hot'?'🔥 الأكثر مبيعاً':p.badge==='new'?'✨ جديد':'مجاني')+'</span>':'';
document.getElementById('pc').innerHTML=`<div class="card"><div class="pthumb ${p.lang}"><i class="ti ${IM[p.skill]||'ti-book-2'}" style="color:${CM[p.lang]||'#534AB7'};font-size:52px"></i>${bd}</div><h1 class="ptitle">${p.title}</h1><div class="chips"><span class="chip cp">${p.level}</span><span class="chip cp">${LN[p.lang]}</span><span class="chip cg"><i class="ti ti-star"></i> ${p.rating} (${p.reviews} تقييم)</span>${p.free?'<span class="chip cj">مجاني</span>':''}</div><p class="pdesc">${p.desc}</p><div class="features"><div class="feat"><i class="ti ti-infinity"></i><div class="feat-val">مدى الحياة</div><div class="feat-lbl">وصول دائم</div></div><div class="feat"><i class="ti ti-device-mobile"></i><div class="feat-val">جميع الأجهزة</div><div class="feat-lbl">متوافق</div></div><div class="feat"><i class="ti ti-certificate"></i><div class="feat-val">شهادة</div><div class="feat-lbl">عند الإتمام</div></div></div></div><div class="card"><div class="rev-title"><i class="ti ti-star-filled" style="color:var(--gold)"></i> تقييمات الطلاب (${rl.length})</div>${rl.map(r=>`<div class="rev"><div class="av">${(r.n||'?').slice(0,2)}</div><div><div class="rn">${r.n}</div><div class="rs">${'★'.repeat(r.r)}${'☆'.repeat(5-r.r)}</div><div class="rt">${r.c}</div></div></div>`).join('')}</div>`;
const pr=JSON.stringify({id:p.id,title:p.title,price:p.price,skill:p.skill,lang:p.lang}).replace(/"/g,"'");
const addCart=`(function(){const c=JSON.parse(localStorage.getItem('lingua_cart')||'[]');if(!c.find(i=>i.id==='${p.id}'))c.push(${pr});localStorage.setItem('lingua_cart',JSON.stringify(c));})();`;
document.getElementById('sc2').innerHTML=`<div class="card ss">${p.free?'<div class="pbox" style="color:var(--jade)">مجاني ✓</div>':`<div class="pbox">${p.op?'<del>'+p.op+' ر.س</del>':''} ${p.price} ر.س</div>${p.op?'<span class="stag">وفّر '+Math.round((1-p.price/p.op)*100)+'%</span>':''}`}${p.free?'<button class="btn bj"><i class="ti ti-download"></i> حمّل مجاناً</button>':`<button class="btn bg" onclick='${addCart}location.href="checkout.html"'><i class="ti ti-credit-card"></i> اشترِ الآن</button><button class="btn bh" onclick='${addCart}alert("تمت الإضافة للسلة ✓")'><i class="ti ti-shopping-cart"></i> أضف للسلة</button>`}<div class="gs"><div class="g"><i class="ti ti-shield-check"></i> ضمان استرداد 7 أيام</div><div class="g"><i class="ti ti-infinity"></i> وصول مدى الحياة</div><div class="g"><i class="ti ti-mail"></i> رابط الدرس فوراً</div><div class="g"><i class="ti ti-device-mobile"></i> يعمل على جميع الأجهزة</div></div></div>`;
</script></body></html>
