<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>تفاصيل المنتج — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--plum:#1E1648;--plum-m:#3D2F8A;--plum-l:#EEEDFE;--gold:#C4983A;--gold-l:#FBF4E3;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--white:#fff;--ink:#0F0E1A;--ink-2:#3A3852;--ink-3:#8886A0;--border:#E5E2F0;--danger:#E24B4A;--r-md:10px;--r-lg:16px;--r-xl:22px;}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;}
.nav{background:#fff;border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:10;gap:12px;}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--plum);text-decoration:none;display:flex;align-items:center;gap:8px;}
.logo-mark{width:32px;height:32px;background:var(--plum);border-radius:8px;display:flex;align-items:center;justify-content:center;}.logo-mark i{color:#fff;font-size:16px;}
.back-btn{margin-right:auto;background:none;border:1px solid var(--border);border-radius:var(--r-md);padding:7px 14px;font-size:13px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;}
.back-btn:hover{background:var(--plum-l);}
main{max-width:980px;margin:0 auto;padding:2rem 1.5rem;display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start;}
@media(max-width:700px){main{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);padding:1.5rem;margin-bottom:1rem;}
.pthumb{height:160px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;font-size:56px;position:relative;}
.pthumb.en{background:var(--plum-l)}.pthumb.tr{background:var(--jade-l)}.pthumb.zh{background:#FAECE7}
.ptitle{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--plum);margin-bottom:.75rem;}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;}
.badge-plum{background:var(--plum-l);color:var(--plum-m);}.badge-gold{background:var(--gold-l);color:var(--gold);border:1px solid var(--gold);}
.pdesc{font-size:14px;color:var(--ink-2);line-height:1.8;margin-bottom:1.5rem;}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.feat{background:var(--sand);border-radius:10px;padding:12px;text-align:center;}
.feat i{font-size:22px;color:var(--plum-m);display:block;margin-bottom:6px;}.feat-val{font-size:13px;font-weight:600;color:var(--plum);}.feat-lbl{font-size:11px;color:var(--ink-3);}
.reviews-title{font-size:15px;font-weight:700;color:var(--plum);margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.review-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.review-item:last-child{border-bottom:none;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--plum-l);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--plum-m);flex-shrink:0;}
.r-name{font-size:12px;font-weight:600;color:var(--plum);}.r-stars{color:var(--gold);font-size:12px;margin:2px 0;}.r-text{font-size:13px;color:var(--ink-2);line-height:1.6;}
.price-box{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--plum);margin-bottom:4px;}
.price-box del{font-size:16px;color:var(--ink-3);font-family:inherit;font-weight:400;margin-left:8px;}
.save-tag{font-size:12px;color:var(--jade);background:var(--jade-l);padding:3px 9px;border-radius:5px;font-weight:600;display:inline-block;margin-bottom:1rem;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;border-radius:var(--r-md);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:8px;}
.btn:hover{opacity:.88;}.btn-gold{background:var(--gold);color:var(--plum);}.btn-primary{background:var(--plum);color:#fff;}.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink-2);}
.guarantees{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.g{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);}.g i{color:var(--jade);font-size:14px;}
.sticky-side{position:sticky;top:70px;}
.pcard-badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;}
.badge-hot{background:var(--plum);color:#fff;}.badge-new{background:var(--gold);color:var(--plum);}.badge-free{background:var(--jade-l);color:var(--jade);}
.empty-reviews{color:var(--ink-3);font-size:13px;padding:1rem 0;text-align:center;}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--plum);color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;font-weight:500;z-index:999;transition:transform .3s cubic-bezier(.22,.68,0,1.2);display:flex;align-items:center;gap:8px;}
.toast.show{transform:translateX(-50%) translateY(0);}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:3rem;color:var(--ink-3);}
</style>
</head><body>
<nav class="nav">
  <a class="logo" href="index.html"><div class="logo-mark"><i class="ti ti-language"></i></div>Lingua</a>
  <button class="back-btn" onclick="history.back()"><i class="ti ti-arrow-right"></i> رجوع</button>
</nav>
<main>
  <div id="productContent"><div class="loading"><i class="ti ti-loader" style="font-size:36px;display:block;margin:0 auto 1rem;animation:spin .8s linear infinite;color:var(--plum-m)"></i>جارٍ تحميل المنتج...</div></div>
  <div id="sidebarContent"></div>
</main>
<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toastMsg"></span></div>
<script>
const imap={listening:'ti-ear',speaking:'ti-messages',reading:'ti-book-2',writing:'ti-pencil',pdf:'ti-file-type-pdf',audio:'ti-player-play',bundle:'ti-package'};
const cmap={en:'#534AB7',tr:'#0B5E46',zh:'#993C1D'};
const lname={en:'إنجليزية',tr:'تركية',zh:'صينية'};
let _tt;
function showToast(msg){const t=document.getElementById('toast'),m=document.getElementById('toastMsg');if(t&&m){m.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2800);}}

const cart={
  get:()=>JSON.parse(localStorage.getItem('lingua_cart')||'[]'),
  save:c=>localStorage.setItem('lingua_cart',JSON.stringify(c)),
  add:p=>{const c=cart.get();if(!c.find(i=>i.id===p.id))c.push(p);cart.save(c);showToast('تمت إضافة "'+p.title+'" للسلة ✓');}
};

// بيانات المنتجات المحلية (fallback)
const localProducts = {
  'listen-b1':{id:'listen-b1',title:'الاستماع B1 — مواقف حياتية يومية',price:89,original_price:null,skill:'listening',lang:'en',level:'B1',rating:4.9,review_count:142,description:'درس أكاديمي متكامل في مهارة الاستماع للمستوى B1 — يشمل 20 موقفاً حياتياً مع تسجيلات بصوت الأستاذ كريم وتمارين تفاعلية.',badge:'hot',reviews:[{name:'محمد العتيبي',rating:5,text:'ممتاز جداً، التسجيلات واضحة ومفيدة جداً.'},{name:'سارة الحربي',rating:5,text:'أفضل درس استماع جربته، الأمثلة من الحياة اليومية.'},{name:'خالد الدوسري',rating:5,text:'تحسّن استماعي بشكل ملحوظ بعد أسبوع واحد.'}]},
  'speak-b1':{id:'speak-b1',title:'المحادثة B1 — المطار والسفر',price:75,original_price:99,skill:'speaking',lang:'en',level:'B1',rating:4.8,review_count:98,description:'درس محادثة عملي يغطي مواقف المطار والفندق والسفر — حوارات حقيقية بصوت الأستاذ كريم مع تدريبات نطق.',badge:'new',reviews:[{name:'نورة المطيري',rating:5,text:'تحسّن نطقي كثيراً بعد هذا الدرس.'},{name:'فهد القحطاني',rating:4,text:'محتوى ممتاز ومفيد للسفر.'}]},
  'read-b1':{id:'read-b1',title:'القراءة B1 — كتاب تفاعلي مع تمارين',price:79,original_price:null,skill:'reading',lang:'en',level:'B1',rating:4.9,review_count:76,description:'كتاب PDF تفاعلي يحتوي على 15 نصاً بمستوى B1 مع تمارين فهم وإجابات مفصّلة.',badge:null,reviews:[{name:'ريم العبدالله',rating:5,text:'الكتاب منظّم ومرتّب بشكل أكاديمي.'}]},
  'write-b1':{id:'write-b1',title:'الكتابة B1 — رسائل ونصوص يومية',price:79,original_price:null,skill:'writing',lang:'en',level:'B1',rating:4.7,review_count:54,description:'دليل الكتابة الأكاديمية للمستوى B1 — رسائل رسمية وغير رسمية مع نماذج وتصحيحات.',badge:null,reviews:[]},
  'audio-b1':{id:'audio-b1',title:'قصص صوتية B1 — ثلاث قصص قصيرة',price:0,original_price:null,skill:'audio',lang:'en',level:'B1',rating:5.0,review_count:201,description:'ثلاث قصص صوتية مجانية بمستوى B1 — مقروءة ببطء واضح مع نص مكتوب مرفق.',badge:'free',is_free:true,reviews:[{name:'أحمد السالم',rating:5,text:'هدية رائعة! الصوت واضح والقصص ممتعة.'}]},
  'bundle-b1':{id:'bundle-b1',title:'باقة B1 الكاملة — كل المهارات',price:249,original_price:350,skill:'bundle',lang:'en',level:'B1',rating:5.0,review_count:189,description:'الباقة الشاملة لمستوى B1 تضم جميع المهارات: استماع + محادثة + قراءة + كتابة + قصص صوتية + كتب PDF.',badge:null,reviews:[{name:'مريم الزهراني',rating:5,text:'أفضل استثمار! كل المهارات في مكان واحد.'}]}
};

const id = new URLSearchParams(location.search).get('id');
if(!id){location.href='index.html';}

const p = localProducts[id] || {id,title:'منتج — '+id,price:99,skill:'bundle',lang:'en',level:'B1',rating:4.5,review_count:0,description:'',badge:null,reviews:[]};

document.title = p.title + ' — Lingua';

const badge = p.badge ? '<span class="pcard-badge badge-'+p.badge+'">'+(p.badge==='hot'?'🔥 الأكثر مبيعاً':p.badge==='new'?'✨ جديد':'مجاني')+'</span>' : '';

document.getElementById('productContent').innerHTML =
  '<div class="card">'
  +'<div class="pthumb '+p.lang+'"><i class="ti '+(imap[p.skill]||'ti-book-2')+'" style="color:'+(cmap[p.lang]||'#534AB7')+'"></i>'+badge+'</div>'
  +'<h1 class="ptitle">'+p.title+'</h1>'
  +'<div class="badges"><span class="badge badge-plum">'+p.level+'</span><span class="badge badge-plum">'+lname[p.lang]+'</span>'
  +'<span class="badge badge-gold"><i class="ti ti-star"></i> '+p.rating+' ('+p.review_count+' تقييم)</span>'
  +(p.is_free?'<span class="badge" style="background:var(--jade-l);color:var(--jade)">مجاني</span>':'')
  +'</div>'
  +'<p class="pdesc">'+(p.description||'درس أكاديمي متكامل من الأستاذ كريم.')+'</p>'
  +'<div class="features">'
  +'<div class="feat"><i class="ti ti-infinity"></i><div class="feat-val">مدى الحياة</div><div class="feat-lbl">وصول دائم</div></div>'
  +'<div class="feat"><i class="ti ti-device-mobile"></i><div class="feat-val">جميع الأجهزة</div><div class="feat-lbl">متوافق</div></div>'
  +'<div class="feat"><i class="ti ti-certificate"></i><div class="feat-val">شهادة</div><div class="feat-lbl">عند الإتمام</div></div>'
  +'</div></div>'
  +'<div class="card">'
  +'<div class="reviews-title"><i class="ti ti-star-filled" style="color:var(--gold)"></i> تقييمات الطلاب ('+p.reviews.length+')</div>'
  +(p.reviews.length
    ? p.reviews.map(r=>'<div class="review-item"><div class="avatar">'+r.name.slice(0,2)+'</div><div><div class="r-name">'+r.name+'</div><div class="r-stars">'+'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)+'</div><div class="r-text">'+r.text+'</div></div></div>').join('')
    : '<div class="empty-reviews">لا توجد تقييمات بعد</div>')
  +'</div>';

const priceHtml = p.is_free
  ? '<div class="price-box" style="color:var(--jade)">مجاني</div>'
  : '<div class="price-box">'+(p.original_price?'<del>'+p.original_price+' ر.س</del>':'')+' '+p.price+' ر.س</div>'
    +(p.original_price?'<span class="save-tag">وفّر '+Math.round((1-p.price/p.original_price)*100)+'%</span>':'');

document.getElementById('sidebarContent').innerHTML =
  '<div class="card sticky-side">'
  +priceHtml
  +(p.is_free
    ? '<button class="btn btn-jade" onclick="showToast('جارٍ التحميل...')"><i class="ti ti-download"></i> حمّل مجاناً</button>'
    : '<button class="btn btn-gold" onclick="buyNow()"><i class="ti ti-credit-card"></i> اشترِ الآن</button>'
      +'<button class="btn btn-ghost" onclick="addCart()"><i class="ti ti-shopping-cart"></i> أضف للسلة</button>')
  +'<div class="guarantees">'
  +'<div class="g"><i class="ti ti-shield-check"></i> ضمان استرداد 7 أيام</div>'
  +'<div class="g"><i class="ti ti-infinity"></i> وصول مدى الحياة</div>'
  +'<div class="g"><i class="ti ti-mail"></i> رابط الدرس فوراً</div>'
  +'<div class="g"><i class="ti ti-device-mobile"></i> يعمل على جميع الأجهزة</div>'
  +'</div></div>';

function addCart(){cart.add({id:p.id,title:p.title,price:p.price,skill:p.skill,lang:p.lang});}
function buyNow(){cart.add({id:p.id,title:p.title,price:p.price,skill:p.skill,lang:p.lang});location.href='checkout.html';}
</script>
</body></html>
