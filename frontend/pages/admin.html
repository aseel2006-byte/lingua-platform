<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--plum:#1E1648;--plum-m:#3D2F8A;--plum-l:#EEEDFE;--gold:#C4983A;--gold-l:#FBF4E3;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--white:#fff;--ink:#0F0E1A;--ink-2:#3A3852;--ink-3:#8886A0;--border:#E5E2F0;--danger:#E24B4A;--r-lg:16px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;display:flex;}
.sidebar{width:220px;background:var(--plum);min-height:100vh;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sb-logo{padding:1.5rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.1);}
.sb-logo-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#fff;}
.sb-logo-sub{font-size:10px;color:var(--gold);}
.nav-lbl{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.1em;padding:10px 1.25rem 4px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 1.25rem;font-size:13px;color:#AFA9EC;cursor:pointer;border-right:3px solid transparent;}
.nav-item:hover,.nav-item.active{color:#fff;background:rgba(255,255,255,.08);}
.nav-item.active{border-right-color:var(--gold);}
.nav-item i{font-size:17px;}
.sb-nav{flex:1;padding:.75rem 0;}
.sb-foot{padding:1rem 1.25rem;border-top:1px solid rgba(255,255,255,.1);}
.logout{display:flex;align-items:center;gap:8px;font-size:12px;color:#AFA9EC;cursor:pointer;padding:8px;border-radius:8px;}
.logout:hover{color:#fff;}
.main{flex:1;padding:2rem;overflow-x:hidden;}
.ph-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--plum);margin-bottom:1.5rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;}
.sc{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.25rem;}
.sc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px;}
.sc-icon.p{background:var(--plum-l);color:var(--plum-m);}
.sc-icon.g{background:var(--gold-l);color:var(--gold);}
.sc-icon.j{background:var(--jade-l);color:var(--jade);}
.sc-val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--plum);display:block;}
.sc-lbl{font-size:11px;color:var(--ink-3);}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;margin-bottom:1rem;}
.card-title{font-size:14px;font-weight:700;color:var(--plum);margin-bottom:1rem;}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--sand);}
td{font-size:13px;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--ink-2);}
tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;}
.bj{background:var(--jade-l);color:var(--jade);}
.bd{background:#FCEBEB;color:var(--danger);}
.bg{background:var(--gold-l);color:var(--gold);}
.hidden{display:none!important}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr);}}
</style>
</head><body>
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-name">Lingua Admin</div>
    <div class="sb-logo-sub">لوحة الإدارة</div>
  </div>
  <nav class="sb-nav">
    <div class="nav-lbl">الإدارة</div>
    <div class="nav-item active" onclick="show('overview',this)"><i class="ti ti-dashboard"></i> نظرة عامة</div>
    <div class="nav-item" onclick="show('orders',this)"><i class="ti ti-receipt"></i> الطلبات</div>
    <div class="nav-item" onclick="show('users',this)"><i class="ti ti-users"></i> الطلاب</div>
    <div class="nav-lbl">الموقع</div>
    <div class="nav-item" onclick="location.href='index.html'"><i class="ti ti-home"></i> الرئيسية</div>
  </nav>
  <div class="sb-foot"><div class="logout" onclick="auth.logout()"><i class="ti ti-logout"></i> خروج</div></div>
</aside>
<div class="main">
  <div id="s-overview">
    <h1 class="ph-title">نظرة عامة</h1>
    <div class="stats">
      <div class="sc"><div class="sc-icon p"><i class="ti ti-users"></i></div><span class="sc-val" id="st1">-</span><div class="sc-lbl">الطلاب</div></div>
      <div class="sc"><div class="sc-icon g"><i class="ti ti-cash"></i></div><span class="sc-val" id="st2">-</span><div class="sc-lbl">الإيرادات ر.س</div></div>
      <div class="sc"><div class="sc-icon j"><i class="ti ti-books"></i></div><span class="sc-val" id="st3">-</span><div class="sc-lbl">المنتجات</div></div>
      <div class="sc"><div class="sc-icon p"><i class="ti ti-star"></i></div><span class="sc-val" id="st4">-</span><div class="sc-lbl">متوسط التقييم</div></div>
    </div>
    <div class="card">
      <div class="card-title">آخر الطلبات</div>
      <table><thead><tr><th>الطالب</th><th>المبلغ</th><th>الحالة</th><th>التاريخ</th></tr></thead>
      <tbody id="recentOrders"></tbody></table>
    </div>
  </div>
  <div id="s-orders" class="hidden">
    <h1 class="ph-title">الطلبات</h1>
    <div class="card">
      <table><thead><tr><th>رقم</th><th>الطالب</th><th>المبلغ</th><th>الحالة</th><th>التاريخ</th></tr></thead>
      <tbody id="allOrders"></tbody></table>
    </div>
  </div>
  <div id="s-users" class="hidden">
    <h1 class="ph-title">الطلاب</h1>
    <div class="card">
      <table><thead><tr><th>الاسم</th><th>الإيميل</th><th>الدروس</th><th>الحالة</th></tr></thead>
      <tbody id="allUsers"></tbody></table>
    </div>
  </div>
</div>
<script src="../js/api.js"></script>
<script>
(function(){if(!auth.isLoggedIn()||auth.getUser()?.role!=='admin'){location.href='auth.html';return;}})();
const sb={paid:'<span class="badge bj">مدفوع</span>',pending:'<span class="badge bg">معلق</span>',failed:'<span class="badge bd">فشل</span>',refunded:'<span class="badge bd">مسترد</span>'};
async function loadOverview(){
  try{
    const d=await api.adminStats();
    document.getElementById('st1').textContent=Number(d.totalStudents).toLocaleString('ar');
    document.getElementById('st2').textContent=Number(d.totalRevenue).toLocaleString('ar');
    document.getElementById('st3').textContent=d.totalProducts;
    document.getElementById('st4').textContent=d.avgRating||'-';
    document.getElementById('recentOrders').innerHTML=(d.recentOrders||[]).map(o=>'<tr><td>'+o.name+'</td><td style="font-weight:700;color:var(--plum)">'+Number(o.total).toFixed(0)+' ر.س</td><td>'+(sb[o.status]||o.status)+'</td><td style="color:var(--ink-3)">'+new Date(o.created_at).toLocaleDateString('ar-SA')+'</td></tr>').join('');
  }catch(e){console.error(e);}
}
async function loadOrders(){
  try{
    const{orders}=await api.adminOrders();
    document.getElementById('allOrders').innerHTML=orders.map(o=>'<tr><td style="font-family:monospace;font-size:11px">#'+o.id.slice(-8).toUpperCase()+'</td><td>'+o.name+'</td><td style="font-weight:700;color:var(--plum)">'+Number(o.total).toFixed(0)+' ر.س</td><td>'+(sb[o.status]||o.status)+'</td><td style="color:var(--ink-3)">'+new Date(o.created_at).toLocaleDateString('ar-SA')+'</td></tr>').join('');
  }catch(e){console.error(e);}
}
async function loadUsers(){
  try{
    const{users}=await api.adminUsers();
    document.getElementById('allUsers').innerHTML=users.map(u=>'<tr><td style="font-weight:600;color:var(--plum)">'+u.name+'</td><td dir="ltr" style="font-size:12px">'+u.email+'</td><td>'+u.enrolled_count+' دروس</td><td>'+(u.is_active?'<span class="badge bj">نشط</span>':'<span class="badge bd">موقوف</span>')+'</td></tr>').join('');
  }catch(e){console.error(e);}
}
function show(name,el){
  document.querySelectorAll('[id^="s-"]').forEach(s=>s.classList.add('hidden'));
  document.getElementById('s-'+name).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  if(name==='orders')loadOrders();
  if(name==='users')loadUsers();
}
loadOverview();
</script>
</body></html>
