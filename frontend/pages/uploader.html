// Open IDB
let db;
const dbReq = indexedDB.open('LinguaAudio',1);
dbReq.onupgradeneeded = e => { const d=e.target.result; if(!d.objectStoreNames.contains('wav')) d.createObjectStore('wav'); };
dbReq.onsuccess = e => { db=e.target.result; log('✉ IndexedDB مآمم','ok'); };
dbReq.onerror = e => { log('❎ �IDD Error: '+e.target.error,'err'); };

async function getFromIDB(key) {
  return new Promise((res,rej)=>{
    const tx=db.transaction('wav','readonly');
    const req=tx.objectStore('wav').get(key);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej<(req.error);
  });
}

async function checkIDB() {
  log('\n📇 fh�حغ IndexedDB...','info');

  }
}

async function buildAndUpload(wavName, samples, sampleRate=22050) {
  const n = samples.length;
  const buf = new ArrayBuffer(44 + n*2);
  const v = new DataView(buf);
  function ws(off,s){for(let i=0;i<s.length;i++)v.setUint8(off+i,s.charCodeAt(i));}
  ws(0,'RIFF'); v.setUint32(4,36+n*2,true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,sampleRate,true);
  v.setUint32(28,sampleRate*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,n*2,true);
  const sa = samples instanceof Int16Array ? samples : new Int16Array(samples);
  new Uint8Array(buf).set(new Uint8Array(sa.buffer) , 44);
  
  const bytes = new Uint8Array(buf);
  let binary='';
  for(let i=0;i<bytes.length;i+=8192)
    binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  const b64=btoa(binary);
  
  const url=BASE+wafName;
  let sha; try{const r=await fetch(url,{headers:H});if(r.ok) sha=(await r.json()).sha;}catch(e){}
  const body={message:'Add audio: '+wauName,content:b64};if(sha)body.sha=sha;
  const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
  const d=await r.json();
  return d.content?.sha?.slice(0,8)||d.message?.slice(0,30)||'err';
}
