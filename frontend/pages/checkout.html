<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>الدفع — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{--plum:#1E1648;--plum-m:#3D2F8A;--plum-l:#EEEDFE;--gold:#C4983A;--gold-l:#FBF4E3;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--ink:#0F0E1A;--ink-2:#3A3852;--ink-3:#8886A0;--border:#E5E2F0;--border-d:#D0CCEC;--danger:#E24B4A;--r-md:10px;--r-lg:16px;--r-xl:22px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;}
.nav{background:#fff;border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 2rem;gap:16px;position:sticky;top:0;z-index:10;}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--plum);display:flex;align-items:center;gap:8px;}
.logo-mark{width:32px;height:32px;background:var(--plum);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.logo-mark i{color:#fff;font-size:16px}
.steps{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);margin-right:auto;}
.step{padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;}
.step.active{color:var(--plum);font-weight:600;background:var(--plum-l);}
.step.done{color:var(--jade);}
main{max-width:900px;margin:0 auto;padding:2rem 1.5rem;display:grid;grid-template-columns:1fr 320px;gap:1.5rem;align-items:start;}
@media(max-width:700px){main{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);padding:1.5rem;margin-bottom:1rem;}
.sec-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--plum);margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.sec-title i{color:var(--gold);}
.field{margin-bottom:14px}
label{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:5px;}
.iw{position:relative}
.iw i{position:absolute;top:50%;transform:translateY(-50%);right:12px;font-size:15px;color:var(--ink-3);}
input{width:100%;padding:10px 38px 10px 12px;border:1px solid var(--border-d);border-radius:var(--r-md);font-size:13px;font-family:inherit;color:var(--ink);outline:none;transition:.15s;}
input:focus{border-color:var(--plum-m);box-shadow:0 0 0 3px rgba(83,74,183,.1);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stripe-wrap{background:linear-gradient(135deg,#1E1648,#3D2F8A);border-radius:var(--r-lg);padding:1.5rem;margin:1rem 0;}
.s-label{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.06em;margin-bottom:8px;}
.s-el{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:12px 14px;}
.s-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.secure{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-top:10px;}
.secure i{color:var(--jade);font-size:14px;}
.order-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.order-row:last-child{border-bottom:none;}
.order-icon{width:38px;height:38px;border-radius:8px;background:var(--plum-l);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--plum-m);flex-shrink:0;}
.order-name{flex:1;font-size:13px;font-weight:600;color:var(--plum);}
.order-price{font-size:14px;font-weight:700;color:var(--plum);}
.order-total{display:flex;justify-content:space-between;padding:12px 0 0;font-size:16px;font-weight:700;color:var(--plum);border-top:2px solid var(--border);margin-top:4px;}
.btn-checkout{width:100%;padding:14px;background:var(--gold);color:var(--plum);border:none;border-radius:var(--r-md);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:.15s;margin-top:1rem;}
.btn-checkout:hover{opacity:.88;}.btn-checkout:disabled{opacity:.6;cursor:not-allowed;}
.guarantee{display:flex;flex-direction:column;gap:6px;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);}
.g-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);}
.g-item i{font-size:14px;color:var(--jade);}
.alert{padding:10px 14px;border-radius:var(--r-md);font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.alert-danger{background:#FCEBEB;color:var(--danger);border:1px solid #F7C1C1;}
.alert-success{background:var(--jade-l);color:var(--jade);border:1px solid #9FE1CB;}
.hidden{display:none!important;}
.spin{width:18px;height:18px;border:2px solid rgba(30,22,72,.2);border-top-color:var(--plum);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:2rem;color:var(--ink-3);font-size:13px;}
</style></head>
<body>
<nav class="nav">
  <div class="logo"><div class="logo-mark"><i class="ti ti-language"></i></div>Lingua</div>
  <div class="steps">
    <div class="step done"><i class="ti ti-check"></i> السلة</div>
    <span style="color:var(--border-d)">›</span>
    <div class="step active"><i class="ti ti-credit-card"></i> الدفع</div>
    <span style="color:var(--border-d)">›</span>
    <div class="step"><i class="ti ti-circle-check"></i> التأكيد</div>
  </div>
</nav>
<main>
  <div>
    <div class="alert alert-danger hidden" id="alertBox"><i class="ti ti-alert-circle"></i><span id="alertMsg"></span></div>
    <div class="card">
      <div class="sec-title"><i class="ti ti-user"></i> معلومات الطالب</div>
      <div class="grid2">
        <div class="field"><label>الاسم الكامل</label><div class="iw"><i class="ti ti-user"></i><input type="text" id="buyerName" placeholder="اسمك الكريم"></div></div>
        <div class="field"><label>البريد الإلكتروني</label><div class="iw"><i class="ti ti-mail"></i><input type="email" id="buyerEmail" placeholder="you@example.com" dir="ltr"></div></div>
      </div>
      <div class="field"><label>رقم الجوال (واتساب)</label><div class="iw"><i class="ti ti-device-mobile"></i><input type="tel" id="buyerPhone" placeholder="+966 5X XXX XXXX" dir="ltr"></div></div>
    </div>
    <div class="card">
      <div class="sec-title"><i class="ti ti-credit-card"></i> بيانات البطاقة</div>
      <div class="stripe-wrap">
        <div class="s-label">CARD NUMBER</div>
        <div class="s-el" id="cardNumber"></div>
        <div class="s-row">
          <div><div class="s-label" style="margin-top:10px">EXPIRY</div><div class="s-el" id="cardExpiry"></div></div>
          <div><div class="s-label" style="margin-top:10px">CVV</div><div class="s-el" id="cardCvc"></div></div>
        </div>
      </div>
      <div class="secure"><i class="ti ti-lock"></i> دفع آمن 100% عبر Stripe · TLS 1.3 مشفّر</div>
      <div id="cardErr" class="hidden" style="font-size:12px;color:var(--danger);margin-top:8px;display:flex;align-items:center;gap:5px"><i class="ti ti-alert-circle"></i><span id="cardErrMsg"></span></div>
    </div>
  </div>
  <div>
    <div class="card">
      <div class="sec-title"><i class="ti ti-shopping-bag"></i> ملخص الطلب</div>
      <div id="orderItems"></div>
      <div id="orderTotals" class="hidden">
        <div class="order-total"><span>الإجمالي</span><span id="totalVal"></span></div>
      </div>
      <button class="btn-checkout" id="checkoutBtn" onclick="handleCheckout()" disabled>
        <i class="ti ti-credit-card"></i><span id="checkoutTxt">ادفع الآن</span>
      </button>
      <div class="alert alert-success hidden" id="successMsg"><i class="ti ti-check"></i> تم الدفع! سيصلك رابط الوصول فوراً</div>
      <div class="guarantee">
        <div class="g-item"><i class="ti ti-shield-check"></i> ضمان استرداد 7 أيام</div>
        <div class="g-item"><i class="ti ti-infinity"></i> وصول دائم مدى الحياة</div>
        <div class="g-item"><i class="ti ti-mail"></i> رابط الدرس يصلك فوراً</div>
      </div>
    </div>
  </div>
</main>
<script src="/js/api.js"></script>
<script>
const STRIPE_PK='pk_test_YOUR_STRIPE_PUBLISHABLE_KEY';
let stripeInst,cardNumber,cardExpiry,cardCvc;
(async()=>{
  if(!auth.isLoggedIn()){window.location.href='/auth.html?redirect=/checkout.html';return;}
  const user=auth.getUser();
  if(user){document.getElementById('buyerName').value=user.name||'';document.getElementById('buyerEmail').value=user.email||'';}
  renderCart();initStripe();
})();
function renderCart(){
  const items=cart.get();const container=document.getElementById('orderItems');
  if(!items.length){container.innerHTML='<div class="empty">سلتك فارغة — <a href="/index.html" style="color:var(--plum-m)">تصفح الدروس</a></div>';return;}
  const imap={listening:'ti-ear',speaking:'ti-messages',reading:'ti-book-2',writing:'ti-pencil',audio:'ti-player-play',bundle:'ti-package'};
  container.innerHTML=items.map(p=>'<div class="order-row"><div class="order-icon"><i class="ti '+(imap[p.skill]||'ti-book-2')+'"></i></div><div class="order-name">'+p.title+'</div><div class="order-price">'+Number(p.price).toFixed(0)+' ر.س</div></div>').join('');
  const total=cart.total();
  document.getElementById('totalVal').textContent=total.toFixed(0)+' ر.س';
  document.getElementById('orderTotals').classList.remove('hidden');
  document.getElementById('checkoutBtn').disabled=false;
  document.getElementById('checkoutTxt').textContent='ادفع الآن — '+total.toFixed(0)+' ر.س';
}
function initStripe(){
  stripeInst=Stripe(STRIPE_PK);
  const elements=stripeInst.elements({locale:'ar'});
  const style={base:{color:'#fff',fontSize:'14px',fontFamily:'monospace','::placeholder':{color:'rgba(255,255,255,0.5)'}},invalid:{color:'#E24B4A'}};
  cardNumber=elements.create('cardNumber',{style});cardExpiry=elements.create('cardExpiry',{style});cardCvc=elements.create('cardCvc',{style});
  cardNumber.mount('#cardNumber');cardExpiry.mount('#cardExpiry');cardCvc.mount('#cardCvc');
  [cardNumber,cardExpiry,cardCvc].forEach(el=>el.on('change',e=>{const b=document.getElementById('cardErr');if(e.error){b.classList.remove('hidden');document.getElementById('cardErrMsg').textContent=e.error.message;}else b.classList.add('hidden');}));
}
async function handleCheckout(){
  const items=cart.get();if(!items.length)return;
  const name=document.getElementById('buyerName').value.trim(),email=document.getElementById('buyerEmail').value.trim();
  if(!name||!email){showA('يرجى إدخال الاسم والبريد');return;}
  setLoading(true);
  try{
    const sd=await api.checkout(items.map(i=>({productId:i.id,quantity:1})));
    if(sd.url){window.location.href=sd.url;return;}
    const{error}=await stripeInst.confirmCardPayment(sd.clientSecret,{payment_method:{card:cardNumber,billing_details:{name,email}}});
    if(error){showA(error.message);setLoading(false);}
    else{cart.clear();document.getElementById('successMsg').classList.remove('hidden');setTimeout(()=>{window.location.href='/success.html?session_id='+sd.sessionId;},1500);}
  }catch(e){showA(e.message||'خطأ في الدفع');setLoading(false);}
}
function setLoading(on){const btn=document.getElementById('checkoutBtn');btn.disabled=on;const t=cart.total();btn.innerHTML=on?'<div class="spin"></div> جارٍ المعالجة...':'<i class="ti ti-credit-card"></i> ادفع الآن — '+t.toFixed(0)+' ر.س';}
function showA(msg){const b=document.getElementById('alertBox');b.classList.remove('hidden');document.getElementById('alertMsg').textContent=msg;}
</script></body></html>
