<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>الدفع — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--plum:#1E1648;--plum-l:#EEEDFE;--gold:#C4983A;--gold-l:#FBF4E3;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--white:#fff;--ink:#0F0E1A;--ink-2:#3A3852;--ink-3:#8886A0;--border:#E5E2F0;--r-md:10px;--r-lg:16px;}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--sand);min-height:100vh;color:var(--ink);}
.checkout-nav{background:#fff;border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 2rem;gap:1.5rem;}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--plum);text-decoration:none;display:flex;align-items:center;gap:8px;}
.logo-mark{width:30px;height:30px;background:var(--plum);border-radius:8px;display:flex;align-items:center;justify-content:center;}.logo-mark i{color:#fff;font-size:15px;}
.steps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-right:auto;}
.step{display:flex;align-items:center;gap:4px;}.step.active{color:var(--plum);font-weight:600;}.step i{font-size:14px;}
.sep{color:var(--border);}
.main{max-width:900px;margin:0 auto;padding:2rem 1.5rem;display:grid;grid-template-columns:1fr 320px;gap:1.5rem;align-items:start;}
@media(max-width:700px){.main{grid-template-columns:1fr;}.checkout-nav .steps{display:none;}}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:1.5rem;margin-bottom:1rem;}
.card-title{font-size:14px;font-weight:700;color:var(--plum);margin-bottom:1rem;display:flex;align-items:center;gap:8px;}.card-title i{font-size:16px;color:var(--gold);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.single{grid-template-columns:1fr;}
label{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:5px;}
.input-wrap{position:relative;}
.input-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink-3);}
input[type=text],input[type=email],input[type=tel]{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;font-family:inherit;outline:none;color:var(--ink);}
input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus{border-color:#AFA9EC;}
.card-visual{background:linear-gradient(135deg,var(--plum),var(--plum-m));border-radius:12px;padding:1.5rem;margin-bottom:1rem;color:#fff;min-height:130px;position:relative;overflow:hidden;}
.card-visual::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.06);border-radius:50%;}
.card-visual::after{content:'';position:absolute;bottom:-20px;left:20px;width:80px;height:80px;background:rgba(255,255,255,.04);border-radius:50%;}
.card-chip{width:32px;height:24px;background:var(--gold);border-radius:4px;margin-bottom:1rem;opacity:.85;}
.card-num{font-size:15px;letter-spacing:.2em;margin-bottom:.75rem;opacity:.9;}
.card-info{display:flex;justify-content:space-between;font-size:11px;opacity:.7;}
.card-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card-field input{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;font-family:inherit;outline:none;width:100%;}
.card-field input:focus{border-color:#AFA9EC;}
.card-field label{font-size:11px;color:var(--ink-3);font-weight:600;}
.secure-note{font-size:11px;color:var(--ink-3);text-align:center;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:5px;}
.secure-note i{color:var(--jade);}
.order-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.order-item:last-of-type{border-bottom:none;}
.order-item-name{color:var(--ink-2);flex:1;}
.order-item-price{font-weight:700;color:var(--plum);white-space:nowrap;}
.order-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--plum);padding-top:12px;margin-top:4px;border-top:2px solid var(--border);}
.pay-btn{width:100%;padding:14px;background:var(--gold);color:var(--plum);border:none;border-radius:var(--r-md);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:1rem;transition:.15s;letter-spacing:.04em;}
.pay-btn:hover{opacity:.88;}
.guarantees{display:flex;flex-direction:column;gap:6px;margin-top:1rem;}
.g{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);}.g i{color:var(--jade);font-size:13px;}
.empty-cart{text-align:center;padding:2rem;color:var(--ink-3);}
.empty-cart i{font-size:40px;display:block;margin:0 auto 1rem;opacity:.3;}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--plum);color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;font-weight:500;z-index:999;transition:transform .3s;display:flex;align-items:center;gap:8px;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head><body>
<nav class="checkout-nav">
  <a class="logo" href="index.html"><div class="logo-mark"><i class="ti ti-language"></i></div>Lingua</a>
  <div class="steps">
    <div class="step"><i class="ti ti-shopping-cart"></i> السلة</div>
    <span class="sep">›</span>
    <div class="step active"><i class="ti ti-credit-card"></i> الدفع</div>
    <span class="sep">›</span>
    <div class="step"><i class="ti ti-circle-check"></i> التأكيد</div>
  </div>
</nav>
<div class="main">
  <div>
    <div class="card">
      <div class="card-title"><i class="ti ti-user"></i> معلومات الطالب</div>
      <div class="form-row">
        <div><label>الاسم الكامل</label><div class="input-wrap"><i class="ti ti-user"></i><input type="text" id="fullName" placeholder="اسمك الكريم"/></div></div>
        <div><label>البريد الإلكتروني</label><div class="input-wrap"><i class="ti ti-mail"></i><input type="email" id="email" placeholder="you@example.com"/></div></div>
      </div>
      <div class="form-row single">
        <div><label>رقم الجوال (واتساب)</label><div class="input-wrap"><i class="ti ti-device-mobile"></i><input type="tel" id="phone" placeholder="+966 5X XXX XXXX"/></div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-credit-card"></i> بيانات البطاقة</div>
      <div class="card-visual">
        <div class="card-chip"></div>
        <div class="card-num" id="cardNumDisplay">•••• •••• •••• ••••</div>
        <div class="card-info"><span id="cardNameDisplay">اسم حامل البطاقة</span><span>VALID THRU <span id="expiryDisplay">MM/YY</span></span></div>
      </div>
      <div class="form-row single" style="margin-bottom:10px;">
        <div><label>رقم البطاقة</label><div class="input-wrap"><i class="ti ti-credit-card"></i><input type="text" id="cardNum" maxlength="19" placeholder="•••• •••• •••• ••••" oninput="formatCard(this)"/></div></div>
      </div>
      <div class="card-fields">
        <div class="card-field"><label>تاريخ الانتهاء</label><input type="text" id="expiry" maxlength="5" placeholder="MM/YY" oninput="formatExpiry(this)"/></div>
        <div class="card-field"><label>CVV</label><input type="text" id="cvv" maxlength="3" placeholder="•••"/></div>
      </div>
      <div class="secure-note"><i class="ti ti-lock"></i> دفع آمن 100% عبر TLS 1.3 · Stripe مشفّر</div>
    </div>
  </div>
  <div>
    <div class="card">
      <div class="card-title"><i class="ti ti-shopping-bag"></i> ملخص الطلب</div>
      <div id="orderSummary"><div class="empty-cart"><i class="ti ti-shopping-cart"></i>السلة فارغة</div></div>
      <button class="pay-btn" id="payBtn" onclick="pay()"><i class="ti ti-credit-card"></i> ادفع الآن</button>
      <div class="guarantees">
        <div class="g"><i class="ti ti-shield-check"></i> ضمان استرداد 7 أيام</div>
        <div class="g"><i class="ti ti-infinity"></i> وصول دائم مدى الحياة</div>
        <div class="g"><i class="ti ti-mail"></i> رابط الدرس يصلك فوراً</div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toastMsg"></span></div>
<script>
let _tt;
function showToast(msg,type='ok'){const t=document.getElementById('toast'),m=document.getElementById('toastMsg');t.style.background=type==='err'?'#E24B4A':'#1E1648';m.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3000);}

// تحميل السلة
const cartItems = JSON.parse(localStorage.getItem('lingua_cart')||'[]');
const total = cartItems.reduce((s,i)=>s+Number(i.price),0);

if(cartItems.length){
  document.getElementById('orderSummary').innerHTML =
    cartItems.map(p=>'<div class="order-item"><span class="order-item-name">'+p.title+'</span><span class="order-item-price">'+Number(p.price).toFixed(0)+' ر.س</span></div>').join('')
    +'<div class="order-total"><span>الإجمالي</span><span>'+total.toFixed(0)+' ر.س</span></div>';
} else {
  document.getElementById('payBtn').style.display='none';
}

// تنسيق البطاقة
function formatCard(el){
  let v=el.value.replace(/D/g,'').slice(0,16);
  el.value=v.match(/.{1,4}/g)?.join(' ')||v;
  document.getElementById('cardNumDisplay').textContent = (v+'•'.repeat(16-v.length)).replace(/(.{4})/g,'$1 ').trim();
}
function formatExpiry(el){
  let v=el.value.replace(/D/g,'').slice(0,4);
  if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);
  el.value=v;
  document.getElementById('expiryDisplay').textContent=v||'MM/YY';
}
document.getElementById('cardNum')?.addEventListener('input',()=>{
  const n=document.getElementById('cardNum').value.replace(/D/g,'');
  document.getElementById('cardNumDisplay').textContent=(n+'•'.repeat(Math.max(0,16-n.length))).replace(/(.{4})/g,'$1 ').trim();
});
document.getElementById('fullName')?.addEventListener('input',e=>{
  document.getElementById('cardNameDisplay').textContent=e.target.value||'اسم حامل البطاقة';
});

function pay(){
  const name=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim();
  const cardNum=document.getElementById('cardNum').value.replace(/s/g,'');
  if(!name){showToast('أدخل اسمك الكامل','err');return;}
  if(!email||!email.includes('@')){showToast('أدخل بريداً إلكترونياً صحيحاً','err');return;}
  if(cardNum.length<16){showToast('أدخل رقم البطاقة كاملاً','err');return;}
  const btn=document.getElementById('payBtn');
  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader" style="animation:spin .7s linear infinite"></i> جارٍ المعالجة...';
  setTimeout(()=>{ location.href='success.html'; },2000);
}
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body></html>
