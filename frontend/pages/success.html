<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>تم الدفع — Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--plum:#1E1648;--gold:#C4983A;--jade:#0B5E46;--jade-l:#E0F5EE;--sand:#F9F7F3;--white:#fff;--border:#E5E2F0;--r-lg:16px;--r-xl:22px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--sand);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-xl);padding:3rem 2.5rem;text-align:center;max-width:500px;width:100%;box-shadow:0 8px 40px rgba(30,22,72,.1);}
.check-circle{width:90px;height:90px;background:var(--jade-l);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
.check-circle i{font-size:44px;color:var(--jade);}
h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--plum);margin-bottom:.75rem;}
.sub{font-size:14px;color:#8886A0;line-height:1.7;margin-bottom:2rem;}
.order-box{background:var(--sand);border-radius:var(--r-lg);padding:1.25rem;margin-bottom:1.5rem;text-align:right;}
.order-label{font-size:12px;font-weight:700;color:var(--plum);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.order-label i{color:var(--gold);}
.order-item{font-size:13px;color:#3A3852;padding:7px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.order-item:last-child{border-bottom:none;}
.order-item i{color:var(--jade);font-size:14px;}
.order-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--plum);padding-top:10px;margin-top:4px;border-top:2px solid var(--border);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 24px;border:none;border-radius:var(--r-lg);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:10px;}
.btn:hover{opacity:.88;}
.btn-gold{background:var(--gold);color:var(--plum);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:#3A3852;}
.badges{display:flex;justify-content:center;gap:1.5rem;margin-top:1.5rem;flex-wrap:wrap;}
.trust-badge{display:flex;align-items:center;gap:5px;font-size:12px;color:#8886A0;}
.trust-badge i{font-size:14px;color:var(--jade);}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(30,22,72,.2);border-top-color:var(--plum);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:fixed;pointer-events:none;top:0;left:0;width:100%;height:100%;z-index:-1;}
</style>
</head>
<body>
<div class="card">
  <div class="check-circle"><i class="ti ti-check" id="checkIcon"></i></div>
  <h1 id="mainTitle">جارٍ التحقق...</h1>
  <p class="sub" id="mainSub">انتظر لحظة</p>
  <div id="orderBox" class="order-box" style="display:none">
    <div class="order-label"><i class="ti ti-shopping-bag"></i> الدروس المشتراة</div>
    <div id="orderItems"></div>
    <div class="order-total"><span>الإجمالي</span><span id="orderTotal">-</span></div>
  </div>
  <div id="actions" style="display:none">
    <button class="btn btn-gold" onclick="location.href='dashboard.html'"><i class="ti ti-books"></i> ابدأ التعلّم الآن</button>
    <button class="btn btn-ghost" onclick="location.href='index.html'"><i class="ti ti-shopping-bag"></i> تصفح المزيد</button>
  </div>
  <div class="badges">
    <div class="trust-badge"><i class="ti ti-shield-check"></i> دفع آمن</div>
    <div class="trust-badge"><i class="ti ti-infinity"></i> وصول مدى الحياة</div>
    <div class="trust-badge"><i class="ti ti-mail"></i> رابط فوري</div>
  </div>
</div>
<script src="../js/api.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session_id');

  cart.clear();

  if (!sessionId) {
    document.getElementById('mainTitle').textContent = 'تم الدفع بنجاح! 🎉';
    document.getElementById('mainSub').textContent = 'شكراً لثقتك — سيصلك رابط الدرس عبر البريد الإلكتروني فوراً.';
    document.getElementById('actions').style.display = 'block';
    return;
  }

  try {
    const data = await apiFetch('/stripe/success?session_id=' + sessionId);
    document.getElementById('mainTitle').textContent = 'تم الدفع بنجاح! 🎉';
    document.getElementById('mainSub').textContent = 'شكراً لثقتك بـ Lingua — سيصلك رابط الدرس فوراً.';
    if (data.products?.length) {
      document.getElementById('orderItems').innerHTML = data.products.map(p =>
        '<div class="order-item"><span>' + p + '</span><i class="ti ti-check"></i></div>'
      ).join('');
      if (data.total) document.getElementById('orderTotal').textContent = Number(data.total).toFixed(0) + ' ر.س';
      document.getElementById('orderBox').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('mainTitle').textContent = 'تم الدفع! 🎉';
    document.getElementById('mainSub').textContent = 'سيصلك رابط الدرس فوراً عبر البريد الإلكتروني.';
  }
  document.getElementById('actions').style.display = 'block';
})();
</script>
</body></html>
